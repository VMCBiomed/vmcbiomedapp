<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VMC Maintenance Equipment App — Scan QR</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<!-- ═══════════════════════════════════════════════════════════
     STANDALONE CAMERA SCANNER — exists because Google Apps Script
     itself blocks navigator.mediaDevices.getUserMedia() for every
     page it serves, via its own Permissions-Policy: camera header.
     This is documented directly by Google:
       https://developers.google.com/apps-script/guides/support/troubleshooting
       ("Host the functionality that requires these permissions on a
        separate domain (outside of Apps Script) and open it in a new
        window or tab.")
     This page runs on GitHub Pages (a separate, non-Apps-Script
     domain), where getUserMedia works completely normally — camera
     restriction is Apps-Script-specific, not something inherent to
     iframes or embedding in general. It scans a QR code client-side
     using jsQR, then posts the decoded text back to the Apps Script
     app via window.opener.postMessage(), which the app listens for
     (see the scanner-bridge additions in JavaScript.html).
     ═══════════════════════════════════════════════════════════ -->

<style>
  html,body{margin:0;padding:0;height:100%;background:#0B1E2E;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  #camWrap{position:relative;flex:1;background:#000;overflow:hidden;}
  video{width:100%;height:100%;object-fit:cover;display:block;}
  canvas{display:none;}
  #targetBox{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(70vw,260px);height:min(70vw,260px);
    border:3px solid rgba(255,255,255,.85);border-radius:16px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.4);pointer-events:none;
  }
  #scanLine{
    position:absolute;left:calc(50% - min(35vw,130px));width:min(70vw,260px);height:3px;
    background:linear-gradient(90deg,transparent,#0EA5E9,transparent);border-radius:2px;
    animation:scanAnim 2s linear infinite;top:calc(50% - min(35vw,130px));
  }
  @keyframes scanAnim{0%{top:calc(50% - min(35vw,130px));}50%{top:calc(50% + min(35vw,127px));}100%{top:calc(50% - min(35vw,130px));}}
  #statusBar{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:#0F2535;text-align:center;font-size:14px;color:#CBD5E0;min-height:20px;}
  #statusBar.err{color:#F6AD55;}
  #statusBar.ok{color:#68D391;}
  #topBar{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center;z-index:5;}
  #topBar button{background:rgba(0,0,0,.5);border:none;color:#fff;font-size:15px;font-weight:600;padding:8px 16px;border-radius:20px;cursor:pointer;}
  #uploadRow{padding:0 16px 14px;text-align:center;}
  #uploadRow label{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;font-weight:600;padding:8px 18px;border-radius:20px;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap">
  <div id="camWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="targetBox"></div>
    <div id="scanLine"></div>
    <div id="topBar">
      <button onclick="closeScanner()">✕ Close</button>
      <button id="flipBtn" onclick="flipCamera()" style="display:none;">🔄 Flip</button>
    </div>
  </div>
  <div id="uploadRow">
    <label>📁 Upload QR Image instead
      <input type="file" accept="image/*" style="display:none;" onchange="scanFromFile(this)">
    </label>
  </div>
  <div id="statusBar">Starting camera…</div>
</div>

<script>
// window.opener is the Apps Script app tab/window that opened this page
// via window.open() — postMessage back to it once a QR is decoded.
// targetOrigin is intentionally '*' here because the Apps Script app's
// actual served origin varies (script.google.com vs
// script.googleusercontent.com depending on redirect state) and isn't
// reliably predictable from this side; the receiving end (JavaScript.html)
// validates the message shape itself before acting on it, which is the
// actual security boundary rather than postMessage's targetOrigin.
var _stream = null;
var _facingMode = 'environment';

function setStatus(text, cls){
  var el = document.getElementById('statusBar');
  el.textContent = text;
  el.className = cls || '';
}

function startCamera(){
  stopStream();
  // Bumped back up from 640x480 to 1280x720 "ideal". Small stickers
  // (e.g. ~50x20mm) need real optical/source detail to decode at all —
  // the native camera app on this same device can only read this
  // sticker while zoomed in, which means at low resolution the QR's
  // modules are only a few pixels wide and jsQR simply doesn't have
  // enough data to work with, regardless of how fast the loop runs.
  // Since scanLoop() now crops to just the on-screen target box before
  // running jsQR (see below), we're no longer paying to process the
  // full frame every tick — only the cropped region — so raising the
  // source resolution back up doesn't reintroduce the original
  // per-frame performance cost, it just gives the crop more real detail
  // to upscale from.
  var constraints = { video: { facingMode: _facingMode, width: { ideal: 1280 }, height: { ideal: 720 } } };
  navigator.mediaDevices.getUserMedia(constraints)
    .then(function(stream){
      _stream = stream;
      var video = document.getElementById('video');
      video.srcObject = stream;
      video.play();
      setStatus('Scanning…');
      navigator.mediaDevices.enumerateDevices().then(function(devices){
        var cams = devices.filter(function(d){ return d.kind === 'videoinput'; });
        document.getElementById('flipBtn').style.display = cams.length > 1 ? '' : 'none';
      });
      // If the camera track supports native optical/digital zoom
      // (Android Chrome mostly; iOS Safari generally does not expose
      // this), nudge it in a bit by default. This is genuine extra
      // sensor detail rather than software upscaling, so it helps more
      // than the crop-and-upscale trick alone for a sticker this small.
      // Wrapped defensively since capabilities() support is inconsistent
      // across browsers and should never block scanning if unavailable.
      try {
        var track = stream.getVideoTracks()[0];
        var caps = track.getCapabilities ? track.getCapabilities() : null;
        if (caps && caps.zoom && caps.zoom.max > caps.zoom.min){
          var desiredZoom = Math.min(caps.zoom.max, Math.max(caps.zoom.min, (caps.zoom.min + caps.zoom.max) * 0.35));
          track.applyConstraints({ advanced: [{ zoom: desiredZoom }] }).catch(function(){ /* ignore unsupported */ });
        }
      } catch(zoomErr){ /* zoom not supported on this device/browser — ignore */ }
      _startScanLoop();
      _startScanDiagnostic();
    })
    .catch(function(err){
      setStatus('⚠ Camera unavailable (' + (err.name||'Error') + '): ' + err.message + '. Use "Upload QR Image" below instead.', 'err');
    });
}

function flipCamera(){
  _facingMode = (_facingMode === 'environment') ? 'user' : 'environment';
  startCamera();
}

var _scanFrameCount = 0;
var _scanDiagInterval = null;

// How much of the video frame (centered) to crop before scanning, as a
// fraction of the shorter video dimension. This is meant to roughly
// track the visual #targetBox, which is drawn at min(70vw,260px)
// centered on screen — but the crop is intentionally a bit tighter
// than the visual box (55% vs ~70%) because the box itself has some
// margin/whitespace around the actual sticker when a user centers it,
// and a tighter crop means more of the upscaled canvas is real QR
// signal rather than background.
var CROP_FRACTION = 0.55;

function scanLoop(){
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  try{
    if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0){
      // Crop-and-zoom: instead of feeding jsQR the entire video frame
      // (which dilutes a small sticker's QR down to a handful of
      // pixels), crop just the centered region the user is visually
      // aiming at via #targetBox, then draw that crop into a larger
      // destination canvas so it gets upscaled. This is software doing
      // the same thing pinch-zooming the native camera app does —
      // concentrating all the resolution on the area that matters
      // instead of spreading it across the whole scene.
      var shorter = Math.min(video.videoWidth, video.videoHeight);
      var cropSize = shorter * CROP_FRACTION;
      var sx = (video.videoWidth - cropSize) / 2;
      var sy = (video.videoHeight - cropSize) / 2;

      var OUTPUT_SIZE = 640; // upscaled output — bigger than the crop's source pixels
      canvas.width = OUTPUT_SIZE;
      canvas.height = OUTPUT_SIZE;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
      _scanFrameCount++;
      if (code){
        // Stop the interval FIRST, synchronously, before anything else
        // runs. setInterval does not pause itself just because its own
        // callback is still executing — if handleResult/stopStream/the
        // postMessage handshake took any time at all (or if
        // window.close() silently failed to actually close the popup,
        // which is a known possibility on some mobile browsers), the
        // interval kept firing every 66ms underneath, re-entering
        // scanLoop and competing with the in-progress teardown for the
        // same video/canvas/stream resources. That's what produced the
        // "freezes and stays there, laggy" symptom — not a single
        // hang, but a background pile-up of overlapping scan attempts
        // after detection, still running invisibly on top of a screen
        // that LOOKED frozen because the visible video feed had
        // already stopped updating.
        _stopScanLoop();
        handleResult(code.data);
        return;
      }
    }
  } catch(loopErr){
    // The loop was previously dying silently on any thrown error here
    // (e.g. a canvas SecurityError, or jsQR itself throwing on a
    // malformed frame) — the schedule would simply never continue, all
    // while the diagnostic (a separate setInterval) kept reporting the
    // video's own state as perfectly healthy, making it look like
    // frames were just never being processed at all instead of the
    // loop having crashed once and stopped. Surfacing this directly
    // instead of swallowing it.
    var statusEl = document.getElementById('statusBar');
    statusEl.textContent = '⚠ Scan loop error: ' + (loopErr.name||'') + ' ' + loopErr.message;
    statusEl.className = 'err';
    _stopScanLoop();
    return;
  }
}

// scanLoop is scheduled via setInterval rather than
// requestAnimationFrame. requestAnimationFrame callbacks are
// deliberately throttled or entirely paused by the browser whenever
// the tab/window isn't the visible, focused, foreground one — and a
// popup window opened via window.open() is not guaranteed to reliably
// hold focus on every mobile browser/OS combination, especially right
// after just changing how that popup opens. That mismatch produces
// exactly this symptom: the video feed itself stays genuinely healthy
// (confirmed by the diagnostic, which uses setInterval and so keeps
// running regardless), while the scan loop's requestAnimationFrame
// callback simply never gets invoked again after the first call,
// silently, with no error — frame count frozen at 0 forever.
// setInterval keeps running on a real wall-clock timer regardless of
// focus/visibility state (browsers only ever throttle its minimum
// interval in a backgrounded tab, they don't stop it outright), so
// this sidesteps the whole class of problem. ~15 scans/sec is more
// than enough for QR detection.
var _scanIntervalId = null;
function _startScanLoop(){
  _stopScanLoop();
  _scanIntervalId = setInterval(scanLoop, 66);
}
function _stopScanLoop(){
  if (_scanIntervalId){ clearInterval(_scanIntervalId); _scanIntervalId = null; }
}

// Live diagnostic — shows actual video/canvas dimensions and how many
// frames have been processed, updated twice a second while scanning.
// Helps distinguish between "the loop isn't running at all" (frame
// count stuck at 0), "the video feed has no real dimensions"
// (0x0 or NaN), vs "frames ARE being processed but jsQR genuinely
// isn't finding a code in them" (count climbing steadily, dimensions
// look normal) — each of those needs a different fix, and this makes
// which one is actually happening visible instead of guessing.
function _startScanDiagnostic(){
  if (_scanDiagInterval) clearInterval(_scanDiagInterval);
  _scanDiagInterval = setInterval(function(){
    var video = document.getElementById('video');
    var statusEl = document.getElementById('statusBar');
    if (statusEl.className === 'ok' || statusEl.className === 'err') return; // don't override a real result/error
    statusEl.textContent = 'Scanning… (frames: ' + _scanFrameCount + ', video: ' + video.videoWidth + 'x' + video.videoHeight + ', ready: ' + video.readyState + ')';
  }, 500);
}
function _stopScanDiagnostic(){
  if (_scanDiagInterval){ clearInterval(_scanDiagInterval); _scanDiagInterval = null; }
}

function scanFromFile(input){
  var file = input.files[0];
  if (!file) return;
  setStatus('Reading image…');
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.getElementById('canvas');
      canvas.width = img.width; canvas.height = img.height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
      if (code) handleResult(code.data);
      else { setStatus('❌ No QR code found in image. Try another image.', 'err'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function handleResult(text){
  setStatus('✅ QR detected — sending to app…', 'ok');
  stopStream();
  // Stop the animated scan-line immediately on detection — it was
  // previously left running for the full 350ms delay before close,
  // which combined with the now-frozen last video frame underneath it
  // is what likely reads as "laggy/frozen" rather than a real hang:
  // the scan-line keeps sliding over a static image instead of live
  // video, which looks broken even though detection already succeeded.
  var scanLineEl = document.getElementById('scanLine');
  if (scanLineEl) scanLineEl.style.display = 'none';

  try{
    if (window.opener && !window.opener.closed){
      window.opener.postMessage({ source: 'vmc-external-scanner', qrText: text }, '*');
      setStatus('✅ Sent — closing…', 'ok');
      // Close immediately rather than waiting 350ms — postMessage is
      // synchronous from the sender's perspective (delivery to the
      // other window's message queue happens right away), so there's
      // no real reason to delay window.close() and every extra
      // millisecond here reads as the page "hanging" after a
      // successful scan.
      window.close();
    } else {
      // Opened directly (not as a popup) — nothing to post back to,
      // so just show the raw result as a fallback.
      setStatus('QR content: ' + text, 'ok');
    }
  } catch(e){
    setStatus('QR content: ' + text, 'ok');
  }
}

function stopStream(){
  _stopScanLoop();
  if (_stream){ _stream.getTracks().forEach(function(t){ t.stop(); }); _stream = null; }
  var video = document.getElementById('video');
  if (video) video.srcObject = null;
  _stopScanDiagnostic();
}

function closeScanner(){
  stopStream();
  // Always attempt window.close() rather than gating it strictly on
  // window.opener being set — a same-origin popup opened via
  // window.open() can still be closable even if opener detection is
  // unreliable in some mobile browser contexts. window.close() is a
  // harmless no-op if the browser doesn't permit it (it won't throw),
  // so this is safe to just try either way; the fallback message only
  // shows if the tab is still visibly open a moment later.
  window.close();
  setTimeout(function(){
    setStatus('You can close this tab now.');
  }, 300);
}

window.addEventListener('beforeunload', stopStream);

// jsQR is loaded from a CDN <script> tag in <head> — normally that
// blocks page execution until it's fully loaded and defines the
// global jsQR function, but a slow/flaky mobile connection, an ad
// blocker, or a privacy browser that blocks cdnjs.cloudflare.com
// specifically can leave it undefined even with correct tag order.
// Checking here means the failure surfaces clearly as "the QR library
// didn't load" with a retry button, rather than only being caught
// deep inside the scan loop's own try/catch as a generic
// ReferenceError once scanning had already silently started.
function _initScannerPage(){
  if (typeof jsQR !== 'function'){
    setStatus('⚠ QR scanning library failed to load — check your connection and retry.', 'err');
    var retryBtn = document.createElement('button');
    retryBtn.textContent = '🔄 Retry';
    retryBtn.style.cssText = 'margin-top:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:13px;font-weight:600;padding:8px 18px;border-radius:20px;cursor:pointer;';
    retryBtn.onclick = function(){ retryBtn.remove(); window.location.reload(); };
    document.getElementById('statusBar').appendChild(document.createElement('br'));
    document.getElementById('statusBar').appendChild(retryBtn);
    return;
  }
  startCamera();
}
_initScannerPage();
</script>
</body>
</html>
