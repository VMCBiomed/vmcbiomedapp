<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VMC Biomedical – PM & Calibration</title>

<!-- ═══════════════════════════════════════════════════════════
     REAL web app manifest, served directly from GitHub Pages with
     no redirect — this is what Apps Script itself cannot do (every
     Apps Script response is forced through a Google execution
     redirect, which breaks Chrome's installability check). Because
     THIS page is what gets installed, Chrome now sees a valid
     manifest with "display":"standalone" and will actually launch
     the installed icon full-screen, no address bar — instead of
     falling back to opening a normal browser tab.
     ═══════════════════════════════════════════════════════════ -->
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0F2535">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1MZ5Ox1X0VJegn0tnkV5roNNgoHxWDfuh">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1MZ5Ox1X0VJegn0tnkV5roNNgoHxWDfuh">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VMC Biomed">

<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0F2535;}
  #appFrame{
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    height:100dvh; /* accounts for mobile browser UI / notches correctly */
    border:none;
    display:block;
  }
  /* Simple loading splash shown until the iframe's own content paints —
     avoids a blank white/dark flash on slow connections. */
  #splash{
    position:fixed; inset:0; z-index:10;
    background:#0F2535; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; font-family:system-ui,-apple-system,sans-serif;
    transition:opacity .3s ease;
  }
  #splash img{ width:64px; height:64px; border-radius:16px; }
  #splash .spin{
    width:28px; height:28px; border:3px solid rgba(255,255,255,.25);
    border-top-color:#0EA5E9; border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #splash.hide{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     REPLACE THE URL BELOW with your actual deployed Apps Script web
     app URL (Deploy > Manage deployments > Web app > URL). It looks
     like: https://script.google.com/macros/s/AKfycb.../exec
     ═══════════════════════════════════════════════════════════ -->
<iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbwYG8KK_Bbo0YKAuWEmSnidZdKi_vdqyJGAWOV5SHjz5XRSy70vTCB8_QJEBMCfLX5w/exec" title="VMC Biomedical PM & Calibration" allow="camera *; microphone *; clipboard-write *" allowfullscreen></iframe>

<div id="splash">
  <img src="https://lh3.googleusercontent.com/d/1MZ5Ox1X0VJegn0tnkV5roNNgoHxWDfuh" alt="VMC Biomedical">
  <div class="spin"></div>
</div>

<script>
  // Hide the splash once the iframe reports it has loaded. This can't
  // detect content INSIDE the iframe finishing (cross-origin — the
  // iframe is on script.google.com, this page is on GitHub Pages), only
  // that the frame navigation itself completed, so there's also a
  // generous timeout fallback in case the load event doesn't fire
  // cleanly across origins in some browsers.
  var frame=document.getElementById('appFrame');
  var splash=document.getElementById('splash');
  function hideSplash(){ splash.classList.add('hide'); }
  frame.addEventListener('load', function(){ setTimeout(hideSplash, 400); });
  setTimeout(hideSplash, 4000); // fallback safety net
</script>

</body>
</html>
